services:
  gmd-dashboard-website:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # Replaced 'build:' with the GHCR image
    image: ghcr.io/laser-power-infra/gmd-dashboard-website:${APP_VERSION:-latest}

    container_name: gmd-dashboard-website
    ports:
      - "3980:3980"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3980
      HOSTNAME: 0.0.0.0

      

    restart: unless-stopped

    networks:
      - infra



networks:
  infra:
    external: true